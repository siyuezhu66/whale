name: daily-remind

# 每天北京时间 09:00 / 17:00 各推一条到微信（17:00 = 提前量，晚上才有空看）
# 注意：GitHub 定时任务用 UTC（北京时间 = UTC + 8），免费账号可能延迟几分钟到几小时
# 想要更准，把 cron 时间再往前挪 1-2 小时即可

on:
  schedule:
    - cron: "0 1 * * *"         # UTC 01:00 = 北京 09:00（早上开工）
    - cron: "0 9 * * *"         # UTC 09:00 = 北京 17:00（下午收尾，留出晚上补的余地）
  workflow_dispatch:            # 也可以手动点一下立即运行

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成并推送今日三行
        env:
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python scripts/daily_remind.py
